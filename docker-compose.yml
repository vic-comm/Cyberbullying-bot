version: '3.8'

networks:
  app_network:
    driver: bridge

services:
  api:
    container_name: cyberbullying-api
    build:
      context: .
      dockerfile: api_service/Dockerfile
    image: cyberbullying-api:latest
    ports:
      - "8000:8000"
    networks:
      - app_network
    env_file: .env
    environment:
      - MODEL_LOCAL_PATH=/app/baked_model
      - BAKED_BERT_PATH=/app/baked_bert
      - TRANSFORMERS_OFFLINE=1
      - LOGS_PATH=/app/data/raw_logs.jsonl
    volumes:
      - ./baked_model:/app/baked_model
      - ./baked_bert:/app/baked_bert
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s 
    restart: unless-stopped
  bot:
    container_name: cyberbullying-bot
    build:
      context: .
      dockerfile: bot_service/Dockerfile
    image: cyberbullying-bot:latest
    networks:
      - app_network
    depends_on:
      api:
        condition: service_healthy 
    env_file: .env
    environment:
      - BASE_URL=http://api:8000 
      - DB_PATH=/app/data/bot_memory.db
    volumes:
      - ./bot_data:/app/data
    restart: unless-stopped

  mlops-worker:
    container_name: mlops-worker
    build:
      context: .
      dockerfile: mlops/Dockerfile
    image: mlops-worker:latest
    networks:
      - app_network
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    profiles: ["tools"]