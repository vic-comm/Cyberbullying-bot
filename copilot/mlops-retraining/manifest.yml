# The manifest for the "mlops-retraining" job.
# Read the full specification for the "Scheduled Job" type at:
#  https://aws.github.io/copilot-cli/docs/manifest/scheduled-job/

# Your job name will be used in naming your resources like log groups, ECS Tasks, etc.
name: mlops-retraining
type: Scheduled Job

# Trigger for your task.
on:
  # The scheduled trigger for your job. You can specify a Unix cron schedule or keyword (@weekly) or a rate (@every 1h30m)
  # AWS Schedule Expressions are also accepted: https://docs.aws.amazon.com/AmazonCloudWatch/latest/events/ScheduledEvents.html
  schedule: "rate(14 days)"
#retries: 3        # Optional. The number of times to retry the job before failing.
#timeout: 1h30m    # Optional. The timeout after which to stop the job if it's still running. You can use the units (h, m, s).

# Configuration for your container and task.
image:
  build:
    dockerfile: mlops/Dockerfile
    context: .
  command: ["python", "-m", "mlops.pipeline", "--mode", "run", "--dvc"]

cpu: 1024       # Number of CPU units for the task.
memory: 2048    # Amount of memory in MiB used by the task.
platform: linux/x86_64   # See https://aws.github.io/copilot-cli/docs/manifest/scheduled-job/#platform

# Optional fields for more advanced use-cases.
#
#variables:                    # Pass environment variables as key value pairs.
#  LOG_LEVEL: info

#secrets:                      # Pass secrets from AWS Systems Manager (SSM) Parameter Store.
#  GITHUB_TOKEN: GITHUB_TOKEN  # The key is the name of the environment variable, the value is the name of the SSM parameter.

# You can override any of the values defined above by environment.
#environments:
#  prod:
#    cpu: 2048               # Larger CPU value for prod environment.
# Grant the container permission to talk to your DVC S3 bucket
iam:
  policy:
    Statement:
      - Effect: Allow
        Action:
          - s3:ListBucket
          - s3:GetObject
          - s3:PutObject
          - s3:DeleteObject
        Resource:
          - arn:aws:s3:::cyberbullying-artifacts-victor-obi
          - arn:aws:s3:::cyberbullying-artifacts-victor-obi/*

variables:
  MLFLOW_TRACKING_URI: "https://dagshub.com/obiezuevictor/Cyberbullying-bot.mlflow"
  MLFLOW_ARTIFACT_BUCKET: "cyberbullying-artifacts-victor-obi/mlruns"
  DISCORD_BOT_URL: "https://discord.com/oauth2/authorize?client_id=1465995121517662329&permissions=3942215459007558&integration_type=0&scope=bot"
  EXPERIMENT_NAME: "cyberbullying-detection"
  MODEL_STAGE: "Production"
  LOGS_PATH: "data/raw_logs.jsonl"
  STAGE: "Production"
  LOG_LEVEL: "INFO"
  DAGSHUB_OWNER: "obiezuevictor"
  DAGSHUB_REPO: "Cyberbullying-bot"
  S3_LOGS_KEY: "logs/raw_logs.jsonl"
  BUCKET_NAME: "cyberbullying-artifacts-victor-obi"

secrets:
  DATABASE_URL: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/DATABASE_URL
  MLFLOW_TRACKING_USERNAME: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/MLFLOW_TRACKING_USERNAME
  MLFLOW_TRACKING_PASSWORD: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/MLFLOW_TRACKING_PASSWORD
  DAGSHUB_USER: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/DAGSHUB_USER
  DAGSHUB_TOKEN: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/DAGSHUB_TOKEN
  REDIS_URL: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/REDIS_URL